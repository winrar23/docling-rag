name: docling-rag

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docling}
      POSTGRES_DB: ${POSTGRES_DB:-docling_rag}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${PGDATA_DIR:-./volumes/pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docling} -d ${POSTGRES_DB:-docling_rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # embed: единственный процесс с моделью USER-bge-m3, api/worker/cli ходят к нему по HTTP
  embed:
    build: .
    image: docling-rag:local
    command: ["embed"]
    restart: unless-stopped
    volumes:
      - ${HF_CACHE_DIR:-./volumes/hf-cache}:/hf-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s

  api:
    build: .
    image: docling-rag:local
    command: ["api"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docling}:${POSTGRES_PASSWORD:-docling}@postgres:5432/${POSTGRES_DB:-docling_rag}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      embed:
        condition: service_healthy
    volumes:
      - ${HF_CACHE_DIR:-./volumes/hf-cache}:/hf-cache
      - ${UPLOADS_DIR:-./volumes/uploads}:/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    image: docling-rag:local
    command: ["worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docling}:${POSTGRES_PASSWORD:-docling}@postgres:5432/${POSTGRES_DB:-docling_rag}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      embed:
        condition: service_healthy
    volumes:
      - ${HF_CACHE_DIR:-./volumes/hf-cache}:/hf-cache
      - ${UPLOADS_DIR:-./volumes/uploads}:/uploads

  # dev-вариант api: hot-reload, ./src примонтирован поверх /app/src (editable install)
  api-dev:
    profiles: ["dev"]
    build: .
    image: docling-rag:local
    command: ["api", "--reload"]
    ports:
      - "127.0.0.1:${API_DEV_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docling}:${POSTGRES_PASSWORD:-docling}@postgres:5432/${POSTGRES_DB:-docling_rag}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      embed:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ${HF_CACHE_DIR:-./volumes/hf-cache}:/hf-cache
      - ${UPLOADS_DIR:-./volumes/uploads}:/uploads

  # запуск: docker compose run --rm cli add /books/file.pdf
  cli:
    profiles: ["cli"]
    build: .
    image: docling-rag:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docling}:${POSTGRES_PASSWORD:-docling}@postgres:5432/${POSTGRES_DB:-docling_rag}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      embed:
        condition: service_healthy
    volumes:
      - ${HF_CACHE_DIR:-./volumes/hf-cache}:/hf-cache
      - ${BOOKS_DIR:-./books}:/books:ro
